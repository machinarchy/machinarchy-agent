name: Bug report
description: Report a reproducible Machinarchy Agent defect.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Agent version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04 / linux-amd64
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and sanitized logs
      description: Remove credentials, tokens, hostnames and sensitive payloads.
    validations:
      required: true
