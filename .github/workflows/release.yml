# Reusable Release Please workflow. The calling CI workflow runs it only after
# its checks pass, for pushes to main (stable), beta and alpha (pre-releases).
# See .github/WORKFLOWS.md, "Release channels".
name: Release

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Do not create/update release PRs, tags, or GitHub Releases"
        required: false
        type: boolean
        default: false
    outputs:
      new_release_published:
        description: "Whether this run created a new GitHub Release"
        value: ${{ jobs.release.outputs.new_release_published }}
      new_release_tag:
        description: "Release Git tag"
        value: ${{ jobs.release.outputs.new_release_tag }}
    secrets:
      MY_GITHUB_TOKEN:
        description: "PAT or GitHub App token used by Release Please"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Evaluate and create release with Release Please
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      new_release_published: ${{ steps.release_please.outputs.release_created || 'false' }}
      new_release_tag: ${{ steps.release_please.outputs.tag_name || '' }}
      release_sha: ${{ steps.release_please.outputs.sha || '' }}
    steps:
      - name: Explain dry-run mode
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::dry_run=true: Release Please was not executed."

      # The branch decides the release channel: main is stable, beta and
      # alpha publish pre-releases (v0.0.1-beta.1, v0.0.1-alpha.1). Each
      # channel has its own config and manifest so merging one branch into
      # the next never conflicts.
      - name: Select the release channel
        id: channel
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            main)  channel=stable ;;
            beta)  channel=beta ;;
            alpha) channel=alpha ;;
            *) echo "::error::Branch '$BRANCH' has no release channel (main, beta or alpha)."; exit 1 ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "::notice::Release channel: $channel (branch $BRANCH)"

      - name: Run Release Please
        id: release_please
        if: ${{ !inputs.dry_run }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          config-file: .github/release-please/config.${{ steps.channel.outputs.channel }}.json
          manifest-file: .github/release-please/manifest.${{ steps.channel.outputs.channel }}.json
          target-branch: ${{ github.ref_name }}

  publish-assets:
    name: Build, package and upload the Linux archives
    runs-on: ubuntu-24.04
    needs: release
    if: >-
      ${{
        !inputs.dry_run &&
        needs.release.outputs.new_release_published == 'true'
      }}
    # gh uses MY_GITHUB_TOKEN for the upload; checkout needs read. The
    # attestation step signs with the job's OIDC token and stores the
    # attestation: the caller (ci.yml) must grant the same permissions.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ needs.release.outputs.new_release_tag }}
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_TAG" && -n "$RELEASE_SHA" ]] || { echo "Missing Release Please tag or SHA output." >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "Unexpected release tag: $RELEASE_TAG" >&2
            exit 1
          }
          # The tag's suffix must match the branch it was released from.
          case "$BRANCH" in
            main)  [[ "$RELEASE_TAG" != *-* ]] || { echo "Stable branch released a pre-release tag: $RELEASE_TAG" >&2; exit 1; } ;;
            beta)  [[ "$RELEASE_TAG" == *-beta.* ]] || { echo "Branch beta must release -beta.N tags, got $RELEASE_TAG" >&2; exit 1; } ;;
            alpha) [[ "$RELEASE_TAG" == *-alpha.* ]] || { echo "Branch alpha must release -alpha.N tags, got $RELEASE_TAG" >&2; exit 1; } ;;
          esac

      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Download modules
        run: go mod download

      # The calling workflow already ran format, vet, race tests and the
      # deployment checks on this branch; here only the packaging is checked.
      - name: Build Linux binaries
        env:
          RELEASE_TAG: ${{ needs.release.outputs.new_release_tag }}
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILD_TIME="$(git show -s --format=%cI "${RELEASE_SHA}")"
          LDFLAGS="-s -w -X main.Version=${RELEASE_TAG} -X main.Commit=${RELEASE_SHA} -X main.BuildTime=${BUILD_TIME}"
          for ARCH in amd64 arm64; do
            echo "Building linux/${ARCH}"
            env CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" \
              go build -trimpath -ldflags="${LDFLAGS}" \
              -o "dist/machinarchy-agent-linux-${ARCH}" ./cmd/machinarchy-agent
          done
          echo "BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"

      - name: Create versioned release archives
        env:
          RELEASE_TAG: ${{ needs.release.outputs.new_release_tag }}
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
        run: ./scripts/package-release.sh "${RELEASE_TAG}" "${RELEASE_SHA}" "${BUILD_TIME}" dist

      - name: Upload archives and checksums
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.new_release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            "dist/machinarchy-agent_${TAG}_linux_amd64.tar.gz" \
            "dist/machinarchy-agent_${TAG}_linux_arm64.tar.gz" \
            dist/checksums.txt

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/machinarchy-agent_*.tar.gz
