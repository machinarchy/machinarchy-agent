name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package Linux releases
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must be a version like v1.2.3, optionally with prerelease/build metadata." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Configure optional private protocol module access
        env:
          MODULE_TOKEN: ${{ secrets.MACHINARCHY_PROTOCOL_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MODULE_TOKEN}" ]]; then
            echo "GOPRIVATE=github.com/machinarchy/machinarchy-protocol" >> "${GITHUB_ENV}"
            git config --global url."https://x-access-token:${MODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Download modules
        run: go mod download

      - name: Verify source and deployment packaging
        run: |
          set -euo pipefail
          make fmt-check
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          make deployment-check

      - name: Build Linux binaries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILD_TIME="$(git show -s --format=%cI "${RELEASE_SHA}")"
          LDFLAGS="-s -w -X main.Version=${RELEASE_TAG} -X main.Commit=${RELEASE_SHA} -X main.BuildTime=${BUILD_TIME}"
          for ARCH in amd64 arm64; do
            echo "Building linux/${ARCH}"
            env CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" \
              go build -trimpath -ldflags="${LDFLAGS}" \
              -o "dist/machinarchy-agent-linux-${ARCH}" ./cmd/machinarchy-agent
          done
          echo "BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"

      - name: Create versioned release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: ./scripts/package-release.sh "${RELEASE_TAG}" "${RELEASE_SHA}" "${BUILD_TIME}" dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(dist/machinarchy-agent_"${TAG}"_linux_amd64.tar.gz dist/machinarchy-agent_"${TAG}"_linux_arm64.tar.gz dist/checksums.txt)
          RELEASE_ARGS=(--generate-notes --verify-tag)
          IS_PRERELEASE=false
          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            RELEASE_ARGS+=(--prerelease)
            IS_PRERELEASE=true
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              gh release edit "${TAG}" --prerelease
            fi
          else
            gh release create "${TAG}" "${ASSETS[@]}" "${RELEASE_ARGS[@]}"
          fi
