name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['protocol/v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            protocol/go.mod

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: make fmt-check

      - name: Unit tests (Agent and protocol modules)
        run: make test

      - name: Race detector (Agent and protocol modules)
        run: make test-race

      - name: Vet (Agent and protocol modules)
        run: make vet

      - name: Build
        run: make build

      - name: Deployment packaging checks
        run: make deployment-check

