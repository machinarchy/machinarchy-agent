name: Container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - compose.systemd.yaml
      - scripts/prepare-docker-host.sh
      - scripts/remove-docker-host-policy.sh
      - docs/deployment/docker.md
      - .env.example
      - deployments/**
      - '**/*.go'
      - go.mod
      - go.sum

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Derive image metadata
        id: meta
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="sha-${GITHUB_SHA::12}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build image (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg VERSION=pr-${{ github.event.number }} \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="$(git log -1 --format=%cI)" \
            --tag machinarchy-agent:ci --load .
          # The image must start, report its version and carry the health check.
          docker run --rm machinarchy-agent:ci --version
          test "$(docker image inspect machinarchy-agent:ci --format '{{.Config.User}}')" = "10001:10001"
          docker image inspect machinarchy-agent:ci --format '{{json .Config.Healthcheck.Test}}' | grep -q -- --healthcheck

      - name: Build and push image
        if: github.event_name != 'pull_request'
        run: |
          TAG_ARGS=(--tag '${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}')
          # Only stable semver releases may move the default latest tag.
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]]; then
            TAG_ARGS+=(--tag '${{ steps.meta.outputs.image }}:latest')
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION='${{ steps.meta.outputs.tag }}' \
            --build-arg COMMIT='${{ github.sha }}' \
            --build-arg BUILD_TIME="$(git log -1 --format=%cI)" \
            "${TAG_ARGS[@]}" \
            --push .
