services:
  agent:
    volumes:
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /run/dbus/system_bus_socket
        read_only: true
        bind:
          create_host_path: false
      # systemctl talks to the bus only on a host booted with systemd, which
      # it detects by this directory. An empty tmpfs marks it without
      # exposing the host's /run/systemd.
      - type: tmpfs
        target: /run/systemd/system
        tmpfs:
          size: 4096
          mode: 0755
    group_add:
      - "${MACHINARCHY_DBUS_GID:?Run scripts/prepare-docker-host.sh and set MACHINARCHY_DBUS_GID in .env}"
    environment:
      MACHINARCHY_AGENT_SERVICE_MANAGEMENT_ENABLED: "true"
      MACHINARCHY_AGENT_SERVICE_CONTROL_ENABLED: ${MACHINARCHY_AGENT_SERVICE_CONTROL_ENABLED:-false}
      MACHINARCHY_AGENT_SERVICE_ALLOWLIST: ${MACHINARCHY_AGENT_SERVICE_ALLOWLIST:?Set an exact .service allowlist in .env}
