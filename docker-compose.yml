# Local NATS with JetStream for development. Start a controller (or
# internal/fakecontroller via the integration tests) before running the agent
# with MACHINARCHY_ENVIRONMENT=development.
services:
  nats:
    image: nats:2.15.3-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD", "nats-server", "--signal", "liveness"]
      interval: 5s
      timeout: 3s
      retries: 10
